<!DOCTYPE html>
<html>
<head>
    <title>Welcome | Rishav Gaming World</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-image:
                linear-gradient(rgba(5, 5, 20, 0.25), rgba(5, 5, 20, 0.25)),
                url("ella-don-JomkRNkzKhE-unsplash.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Glass panel */
        .welcome-panel {
            background: rgba(10, 15, 30, 0.5);
            backdrop-filter: blur(8px);

            border: 1px solid rgba(0, 255, 136, 0.5);
            border-radius: 20px;

            padding: 45px;
            text-align: center;

            box-shadow: 0 0 25px rgba(0, 255, 136, 0.15);

            max-width: 750px;
            width: 85%;

            animation: panelEntrance 1.2s ease both,
                       panelFloat 5s ease-in-out 1.2s infinite;
        }

        /* Title */
        h1 {
            color: #00ff88;
            font-size: 40px;

            text-shadow:
                0 0 10px #00ff88,
                0 0 25px rgba(0, 255, 136, 0.7);

            animation: titleEntrance 1.2s ease both;
        }

        /* Welcome text */
        p {
            color: #d0d8e8;
            font-size: 18px;

            animation: textEntrance 1.5s ease both;
        }

        /* Enter button */
        .welcome-button {
            display: inline-block;

            background: #00ff88;
            color: #0b0f19;

            padding: 14px 30px;
            border-radius: 8px;

            text-decoration: none;
            font-weight: bold;

            margin-top: 25px;

            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);

            animation: buttonEntrance 1.8s ease both,
                       buttonPulse 2s ease-in-out 2s infinite;

            transition: all 0.3s ease;
        }

        .welcome-button:hover {
            background: white;
            color: #00a85a;

            transform: scale(1.1);
            box-shadow: 0 0 25px #00ff88;
        }

        .welcome-button:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes panelEntrance {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes panelFloat {
            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -8px;
            }
        }

        @keyframes titleEntrance {
            from {
                opacity: 0;
                transform: translateY(-35px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes textEntrance {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes buttonEntrance {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes buttonPulse {
            0%, 100% {
                box-shadow: 0 0 10px #00ff88;
            }

            50% {
                box-shadow: 0 0 25px #00ff88;
            }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .welcome-panel {
                padding: 25px 15px;
                width: 92%;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    /* Mobile-only Welcome Background */
@media (max-width: 600px) {
    body {
        background-image:
            linear-gradient(
                rgba(5, 5, 15, 0.30),
                rgba(5, 5, 15, 0.45)
            ),
            url("indexmobilebg.jpg");

        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: scroll;
    }
}
    </style>
</head>

<body>

    <div class="welcome-panel">

        <h1>🎮 RISHAV GAMING WORLD</h1>

        <p>Welcome to my gaming universe!</p>

        <a class="welcome-button" href="menu.html">
            ENTER GAMING WORLD ⚡
        </a>

    </div>

</body>
</html>
